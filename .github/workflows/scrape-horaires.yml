name: Horaires hebdomadaires

# Passe « horaires seulement » : chaque lundi, relit la page de chaque cours qui a
# déjà une fiche et ne réécrit que `trimestres`, `apercuHoraires` et `horairesISO`.
# Aucune fiche n'est créée, aucun programme n'est touché. Voir docs/INVENTAIRE-PROGRAMMES.md §12.
#
# DEUX PIÈGES DE GITHUB À CONNAÎTRE
#
#  1. Un push fait avec GITHUB_TOKEN ne déclenche AUCUN autre workflow : ci.yml ne
#     se relancera donc pas sur le commit de données. C'est pour ça que le job
#     final lance `npm test` lui-même avant de pousser. (Les types, le lint
#     et le build ne sont pas relancés : un commit qui ne touche que data/ ne
#     peut pas les casser, et vitest couvre les tests de couture sur les données.)
#
#  2. GitHub DÉSACTIVE un workflow planifié après 60 jours sans activité dans le
#     dépôt. Ses propres commits de données comptent comme activité tant qu'il
#     tourne, mais s'il s'arrête (période creuse, échec répété) il peut se
#     désactiver sans bruit : si les horaires cessent d'avancer, regarder d'abord
#     l'onglet Actions pour un bouton « Enable workflow ».
#
# POLITESSE. Les quatre tranches tournent l'une après l'autre (max-parallel: 1) :
# le serveur de l'UdeM ne voit jamais deux scrapers à la fois, et le délai de
# 1,2 s entre requêtes reste celui d'un seul. robots.txt est relu au début de
# chaque tranche et la tranche s'arrête s'il interdit /cours-et-horaires/.

on:
  schedule:
    # Lundi 09:17 UTC. Minute non ronde : les cron à :00 sont ceux que tout le
    # monde lance, et GitHub les retarde ou les saute quand il est chargé.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      limite_cours:
        description: "Essai court : au plus N fiches PAR TRANCHE (vide = toutes)"
        type: string
        required: false
      ignorer_garde_fou:
        description: "Lancement manuel seulement : le garde-fou s'affiche mais ne bloque pas (après avoir vérifié qu'une baisse est réelle)"
        type: boolean
        default: false

# Lecture seule par défaut ; seul le job final reçoit le droit d'écrire.
permissions:
  contents: read

# Jamais deux passes en même temps (ni avec scrape-complet.yml, qui partage ce
# groupe) : deux scrapers simultanés annulent chacun le délai poli de l'autre.
concurrency:
  group: scrape-udem
  cancel-in-progress: false

# Chaque lundi, toute l'année : les horaires changent aussi hors des périodes
# d'inscription (sections ajoutées, salles, annulations), et un seul calendrier
# à maintenir vaut mieux que des dates d'inscription à deviner chaque année.
jobs:
  tranches:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      # Une tranche en échec n'empêche pas les autres : chaque fiche est
      # indépendante, et le job final applique ce qui est arrivé avant de rougir.
      fail-fast: false
      max-parallel: 1
      matrix:
        # Première lettre du sujet, équilibrée sur le nombre de fiches de
        # data/cours (2026-10-30) : A-D 2480, E-L 1678, M-O 2557, P-Z 2904.
        # Les quatre intervalles couvrent A-Z sans trou ni recouvrement ; si un
        # sujet apparaît hors de ces lettres, il n'est dans aucune tranche.
        tranche: ["A-D", "E-L", "M-O", "P-Z"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Passe d'horaires
        shell: bash
        env:
          TRANCHE: ${{ matrix.tranche }}
          LIMITE: ${{ inputs.limite_cours }}
        run: |
          args=(--horaires-seulement --sujets "$TRANCHE")
          if [ -n "$LIMITE" ]; then args+=(--limite-cours "$LIMITE"); fi
          npm run scrape -- "${args[@]}"

      # Ne dépose que les fichiers modifiés, pas tout data/cours. Le job final ne
      # les COPIE pas : il en reprend fiche par fiche les seuls champs d'horaire
      # (scripts/scrape/appliquer-horaires.ts), sans quoi un fichier de sujet
      # entier, calculé sur le checkout du début de la tranche, écraserait ce qui
      # a changé sur la branche pendant les heures de la passe.
      - name: Rassembler les fichiers modifiés
        if: always()
        shell: bash
        run: |
          mkdir -p sortie
          git ls-files -m -o --exclude-standard -z -- data/cours | xargs -0 -r cp --parents -t sortie
          find sortie -type f | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horaires-${{ matrix.tranche }}
          path: sortie
          if-no-files-found: ignore
          retention-days: 14

  reunir:
    needs: [tranches]
    # `!cancelled()` et non le défaut : une tranche en échec ne doit pas empêcher
    # d'appliquer les trois autres.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # La référence du garde-fou : data/cours tel qu'il est sur la branche, AVANT
      # d'appliquer quoi que ce soit.
      - name: Copie de data/cours avant application
        run: cp -r data/cours "$RUNNER_TEMP/cours-avant"

      - uses: actions/download-artifact@v4
        # Aucun artefact (toutes les tranches ont échoué avant d'écrire) n'est pas
        # une raison d'échouer ici : l'étape de fin rougit la passe.
        continue-on-error: true
        with:
          pattern: horaires-*
          merge-multiple: true
          path: ${{ runner.temp }}/artefacts

      - name: Appliquer les horaires, fiche par fiche
        run: node --experimental-strip-types scripts/scrape/appliquer-horaires.ts "$RUNNER_TEMP/artefacts/data/cours" data/cours

      - name: Garde-fou des horaires
        shell: bash
        env:
          IGNORER: ${{ inputs.ignorer_garde_fou }}
        run: |
          set +e
          node --experimental-strip-types scripts/scrape/garde-fou-horaires.ts "$RUNNER_TEMP/cours-avant" data/cours > "$RUNNER_TEMP/garde-fou.txt" 2>&1
          code=$?
          { echo '### Garde-fou des horaires'; echo '```'; cat "$RUNNER_TEMP/garde-fou.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/garde-fou.txt"
          # Échappatoire MANUELLE seulement (un lancement planifié n'a pas d'entrées) :
          # une baisse réelle, vérifiée sur le site, ne doit pas bloquer chaque lundi.
          if [ "$code" = "1" ] && [ "$IGNORER" = "true" ]; then
            echo "::warning::Garde-fou en échec, ignoré à la demande (lancement manuel)."
            exit 0
          fi
          exit $code

      # Ce que ci.yml aurait fait sur ce commit s'il se déclenchait (voir l'en-tête).
      - name: Tests
        run: npm test

      - name: Commit et push, seulement s'il y a un diff
        shell: bash
        env:
          BRANCHE: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- data/; then
            echo "Aucun changement dans data/ : pas de commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "données : horaires du $(date -u +%F)"
          git pull --rebase origin "$BRANCHE"
          git push origin "HEAD:$BRANCHE"

      - name: Signaler les tranches en échec
        if: ${{ always() && needs.tranches.result != 'success' }}
        run: |
          echo "::error::Au moins une tranche a échoué ou n'a pas pu lire assez de pages (résultat : ${{ needs.tranches.result }}). Ce qui a été lu est appliqué ; les fiches des pages en échec sont intactes."
          exit 1
