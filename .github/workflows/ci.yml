name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `app/layout.tsx` référence `LayoutProps`, un type que Next GÉNÈRE dans
      # .next/types — répertoire ignoré par git, donc absent d'un checkout neuf.
      # Sans cette étape, `tsc --noEmit` échoue en CI alors qu'il passe en local,
      # où un build précédent avait laissé les types générés sur le disque.
      - name: Types générés par Next
        run: npx next typegen

      # Portes ordonnées du moins cher au plus cher : l'échec le plus rapide sort
      # en premier.
      - name: Types
        run: npx tsc --noEmit

      # `npm run lint` porte `--max-warnings 0` depuis 32a7085 : un avertissement
      # d'ESLint sort en 0 et se lit comme un succès, donc le drapeau le rend
      # bloquant. Mais il ne bloquait RIEN tant que la CI ne le lançait pas — le
      # cliquet existait sans être branché, et seule une session qui pensait à
      # taper la commande le voyait. Placé après les types parce qu'il coûte plus
      # cher qu'eux et moins que les tests.
      #
      # Ce contrôle ne voit que les fichiers SUIVIS par git : un brouillon non
      # commité peut casser le lint en local sans que la CI s'en aperçoive.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
