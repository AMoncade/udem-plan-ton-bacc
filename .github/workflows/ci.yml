name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `app/layout.tsx` référence `LayoutProps`, un type que Next GÉNÈRE dans
      # .next/types — répertoire ignoré par git, donc absent d'un checkout neuf.
      # Sans cette étape, `tsc --noEmit` échoue en CI alors qu'il passe en local,
      # où un build précédent avait laissé les types générés sur le disque.
      # Jamais `npx` en CI : un binaire absent de node_modules y serait TÉLÉCHARGÉ
      # sous le même nom. Vécu le 2026-10-30, `npx tsc` a exécuté le paquet npm
      # `tsc@2.0.4`, un bouche-trou, et la porte avait l'air d'avoir tourné. Les
      # scripts npm ne lisent que node_modules/.bin.
      - name: Types générés par Next
        run: npm run typegen

      # Le moteur partagé avec ClientSide Horaire se compile SANS DOM ni Node
      # (packages/moteur/tsconfig.json). C'est la seule porte qui empêche un
      # module de `lib/` ou `app/_lib/` de se mettre à lire `window` ou
      # `localStorage` et de casser l'extension sans que l'app web s'en aperçoive.
      - name: Moteur partagé (ni DOM ni Node)
        run: npm run moteur:build

      # Portes ordonnées du moins cher au plus cher : l'échec le plus rapide sort
      # en premier.
      - name: Types
        run: npm run typecheck

      # `npm run lint` porte `--max-warnings 0` depuis 32a7085 : un avertissement
      # d'ESLint sort en 0 et se lit comme un succès, donc le drapeau le rend
      # bloquant. Mais il ne bloquait RIEN tant que la CI ne le lançait pas — le
      # cliquet existait sans être branché, et seule une session qui pensait à
      # taper la commande le voyait. Placé après les types parce qu'il coûte plus
      # cher qu'eux et moins que les tests.
      #
      # Ce contrôle ne voit que les fichiers SUIVIS par git : un brouillon non
      # commité peut casser le lint en local sans que la CI s'en aperçoive.
      #
      # QUAND CETTE PORTE ROUGIT ET QUE CE N'EST PAS TOI. Une porte bloquante est
      # une ressource partagée : la session arrêtée n'est pas celle qui a causé
      # le rouge, c'est la SUIVANTE qui pousse. Avant de chercher la cause dans
      # ton propre travail, lance `npx --no-install eslint --format json` et regarde le
      # CHEMIN des fichiers fautifs. S'il est hors de ton lot, ne corrige pas :
      # dis-le à son propriétaire. Et si le fichier est non suivi par git — cas
      # déjà vu, un brouillon d'analyse déposé dans `app/_lib/` — il casse le
      # lint de toutes les sessions en local sans jamais toucher la CI : c'est
      # à son auteur de le déplacer hors des répertoires de source.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
